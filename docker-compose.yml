version: '3.8'

services:
  sast-agent:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: agentic-sast-guardian
    environment:
      # .env 파일에서 OPENAI_API_KEY를 읽어와 컨테이너에 주입
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      # 로컬의 target_project 폴더를 컨테이너의 /target 경로로 마운트
      # 실제 검사할 프로젝트 경로명으로 변경해서 사용하세요.
      - ./target_project:/target
      # 컨테이너 내에서 생성된 리포트 파일들을 로컬의 ./reports 폴더와 동기화
      - ./reports:/app/reports
    # 기본 실행 명령어 (ENTRYPOINT 뒤에 붙음)
    command: ["--target", "/target"]
